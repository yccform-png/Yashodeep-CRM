version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: institute_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-institute_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-institute_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-institute_erp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U institute_admin -d institute_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: institute_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: institute_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-institute_admin}:${POSTGRES_PASSWORD:-institute_secure_password_2026}@postgres:5432/${POSTGRES_DB:-institute_erp}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-institute_admin}:${POSTGRES_PASSWORD:-institute_secure_password_2026}@postgres:5432/${POSTGRES_DB:-institute_erp}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: institute_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  uploads_data:
